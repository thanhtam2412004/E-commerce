<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sản phẩm — Green Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="admin-shell">
  <div class="admin-app show">
    <aside class="admin-sidebar">
<div class="admin-logo"><svg fill="none" height="22" viewbox="0 0 40 40" width="22"><circle cx="20" cy="20" r="18" stroke="#8FAE6C" stroke-width="2"></circle><circle cx="20" cy="20" r="11" stroke="#D9AE6C" stroke-width="2"></circle><circle cx="20" cy="20" fill="#fff" r="4"></circle></svg>Green Atelier</div>
<nav class="admin-nav">
<a data-nav="admin-dashboard">📊 Dashboard</a>
<a class="active" data-nav="admin-products">🍵 Sản phẩm</a>
<a data-nav="admin-categories">🏷 Danh mục</a>
<a data-nav="admin-orders">📦 Đơn hàng</a>
<a data-nav="admin-customers">👥 Khách hàng</a>
<a data-nav="admin-blogs">📝 Blog</a>
<div class="divider"></div>
<a data-nav="home">🏠 Xem cửa hàng</a>
<a data-nav="admin-login">↩ Đăng xuất</a>
</nav>
</aside>
    <div class="admin-main">
      <section class="admin-page active" data-page="admin-products">
<div class="admin-topbar"><h2>Quản lý sản phẩm</h2><div class="admin-topbar-right"><span>👤 Admin</span></div></div>
<div class="admin-content">
<div class="toolbar">
<div class="search-box" style="background:#fff;">🔍 Tìm sản phẩm...</div>
<button class="btn btn-primary btn-sm" onclick="openModal('modal-add-product')">+ Thêm sản phẩm</button>
</div>
<table class="data-table">
<thead><tr><th></th><th>Tên sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
<tbody id="admin-products-tbody"></tbody>
</table>
</div>
</section>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal-add-product" onclick="if(event.target===this)closeModal('modal-add-product')">
<div class="modal-box">
<div class="modal-head"><h3>Thêm sản phẩm mới</h3><button onclick="closeModal('modal-add-product')">✕</button></div>
<div class="field"><label>Tên sản phẩm</label><input placeholder="VD: Matcha Rose Beauty"/></div>
<div class="field-row"><div class="field"><label>Danh mục</label><select><option>Focus</option><option>Energy</option><option>Calm</option><option>Beauty</option><option>Immunity</option></select></div><div class="field"><label>Giá (₫)</label><input placeholder="299000"/></div></div>
<div class="field"><label>Mô tả</label><textarea placeholder="Mô tả ngắn về sản phẩm..." rows="3"></textarea></div>
<div class="field"><label>Ảnh sản phẩm (URL)</label><input placeholder="https://..."/></div>
<div class="modal-foot"><button class="btn btn-outline btn-sm" onclick="closeModal('modal-add-product')">Hủy</button><button class="btn btn-primary btn-sm" onclick="closeModal('modal-add-product')">Lưu sản phẩm</button></div>
</div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
